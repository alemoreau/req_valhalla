name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  MIX_ENV: test
  VALHALLA_TEST_URL: ${{ vars.VALHALLA_TEST_URL || 'http://routing-valhalla-borcmc-1f2411-145-223-34-60.traefik.me' }}

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest stable versions
          - elixir: '1.16.x'
            otp: '26.x'
          - elixir: '1.15.x'
            otp: '26.x'
          - elixir: '1.15.x'
            otp: '25.x'
          # Minimum supported version from mix.exs
          - elixir: '1.14.x'
            otp: '25.x'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile code
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted
        if: matrix.elixir == '1.16.x' && matrix.otp == '26.x'

      - name: Run tests
        run: mix test
        env:
          VALHALLA_TEST_URL: ${{ env.VALHALLA_TEST_URL }}

      - name: Run tests with coverage
        run: mix test --cover
        if: matrix.elixir == '1.16.x' && matrix.otp == '26.x'
        env:
          VALHALLA_TEST_URL: ${{ env.VALHALLA_TEST_URL }}
